# OPTIONAL local n8n. Used only for the Docker part of the demo (docker ps).
# The workflows themselves run on the n8n website (n8n Cloud).
services:
  n8n:
    image: docker.n8n.io/n8nio/n8n
    container_name: brew-cup-cafe-n8n
    ports:
      - "5678:5678"
    environment:
      - GENERIC_TIMEZONE=Asia/Kolkata
      - TZ=Asia/Kolkata
    volumes:
      - n8n_data:/home/node/.n8n
    restart: unless-stopped

volumes:
  n8n_data:
